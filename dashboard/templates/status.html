<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Sentinel — Statut</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  .badge { padding: .25rem .6rem; border-radius: .4rem; color: #fff; font-weight: 600; }
  .ok { background: #1a7f37; }
  .killed { background: #b91c1c; }
  button { padding: .5rem 1rem; margin-right: .5rem; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: .85rem; }
  td, th { border-bottom: 1px solid #ddd; padding: .35rem .5rem; text-align: left; }
</style>
</head>
<body>
  <h1>Sentinel — copieur de positions</h1>
  <p>État : <span id="badge" class="badge">...</span> <span id="reason"></span></p>
  <button onclick="post('/api/kill')">Arrêt d'urgence</button>
  <button onclick="post('/api/resume')">Reprendre</button>
  <h2>Positions enregistrées</h2>
  <table id="positions"><thead>
    <tr><th>Ouverte</th><th>Symbole</th><th>Sens</th><th>Volume</th><th>R:R</th><th>Écart risque</th><th>Score</th><th>Contexte SMC</th><th>Résultat (source)</th><th>Statut</th></tr>
  </thead><tbody></tbody></table>

  <h2>Setups détectés sur le marché (alertes)</h2>
  <p id="performance" style="font-size:.85rem;color:#666;"></p>
  <table id="market-patterns"><thead>
    <tr><th>Détecté</th><th>Symbole</th><th>Sens</th><th>Entrée</th><th>SL</th><th>TP</th><th>R:R</th><th>Statut</th></tr>
  </thead><tbody></tbody></table>

  <h2>Derniers événements</h2>
  <table id="events"><thead>
    <tr><th>Heure</th><th>Source</th><th>Cible</th><th>Symbole</th><th>Statut</th></tr>
  </thead><tbody></tbody></table>

<script>
async function refresh() {
  const r = await fetch('/api/status');
  const data = await r.json();
  const badge = document.getElementById('badge');
  badge.textContent = data.kill_switch_active ? 'ARRÊTÉ' : 'ACTIF';
  badge.className = 'badge ' + (data.kill_switch_active ? 'killed' : 'ok');
  const reasonLabels = { MANUAL: '(arrêt manuel)', AUTO_DRAWDOWN: '(protection drawdown journalier)' };
  document.getElementById('reason').textContent = reasonLabels[data.kill_switch_reason] || '';
  const tbody = document.querySelector('#events tbody');
  tbody.innerHTML = '';
  for (const e of data.recent_events) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${e.created_at}</td><td>${e.source_account_id}</td>` +
      `<td>${e.target_account_id}</td><td>${e.symbol}</td><td>${e.status}</td>`;
    tbody.appendChild(tr);
  }

  const pr = await fetch('/api/positions');
  const pdata = await pr.json();
  const ptbody = document.querySelector('#positions tbody');
  ptbody.innerHTML = '';
  for (const p of pdata.positions) {
    const tr = document.createElement('tr');
    const rr = p.rr_ratio === null ? '—' : p.rr_ratio.toFixed(2);
    const tags = [
      p.has_fvg ? 'IMB' : null,
      p.has_liquidity_grab ? 'Liquidité' : null,
      p.has_bos ? 'BOS' : null,
      p.has_order_block ? 'OB' : null,
    ].filter(Boolean).join(', ') || '—';
    let result = '—';
    if (p.source_profit !== null && p.source_profit !== undefined) {
      const cls = p.source_profit >= 0 ? 'color:#1a7f37' : 'color:#b91c1c';
      result = `<span style="${cls}">${p.source_profit.toFixed(2)}</span>`;
    }
    tr.innerHTML = `<td>${p.opened_at}</td><td>${p.symbol}</td><td>${p.side}</td>` +
      `<td>${p.target_volume}</td><td>${rr}</td><td>${p.risk_deviation_pct}%</td>` +
      `<td>${p.quality_score}</td><td>${tags}</td><td>${result}</td><td>${p.status}</td>`;
    ptbody.appendChild(tr);
  }

  const mr = await fetch('/api/market_patterns');
  const mdata = await mr.json();
  const statusColors = {
    HIT_TP: 'color:#1a7f37', HIT_SL: 'color:#b91c1c',
    ACTIVE: 'color:#9a6a00', PENDING: 'color:#666', EXPIRED: 'color:#999',
  };
  const mtbody = document.querySelector('#market-patterns tbody');
  mtbody.innerHTML = '';
  for (const p of mdata.patterns) {
    const tr = document.createElement('tr');
    const style = statusColors[p.status] || '';
    tr.innerHTML = `<td>${p.detected_at}</td><td>${p.symbol}</td><td>${p.direction}</td>` +
      `<td>${p.entry_price}</td><td>${p.stop_loss}</td><td>${p.take_profit}</td>` +
      `<td>${p.rr_ratio}</td><td style="${style}">${p.status}</td>`;
    mtbody.appendChild(tr);
  }
  const perfEl = document.getElementById('performance');
  if (mdata.performance.length === 0) {
    perfEl.textContent = 'Pas encore assez de setups résolus pour un taux de réussite.';
  } else {
    perfEl.textContent = mdata.performance
      .map(p => `${p.symbol} ${p.direction} : ${p.win_rate_pct}% (${p.wins}/${p.resolved_count})`)
      .join(' · ');
  }
}
async function post(path) {
  await fetch(path, { method: 'POST' });
  refresh();
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
