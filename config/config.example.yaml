# Copy this file to config/config.yaml and fill in real paths (that file is
# gitignored -- it may end up containing account identifiers, never commit it).

poll_interval_seconds: 0.5
db_path: data/edgeflow.db
kill_switch_file: data/KILL_SWITCH

risk:
  max_daily_drawdown_pct: 5.0   # auto kill-switch if source equity drops this much in a day
  rr_alert_thresholds: [2.0, 3.0, 4.0]   # notify when an opened trade's reward:risk ratio reaches one of these

# Optional. Leave a channel's keys out entirely to disable it. Never commit
# real tokens/passwords here -- this whole file only exists as config.yaml,
# which is gitignored.
notifications:
  telegram_bot_token: ""   # from @BotFather
  telegram_chat_id: ""     # your chat id (message @userinfobot to find it)
  smtp_host: ""
  smtp_port: 587
  smtp_username: ""
  smtp_password: ""
  email_from: ""
  email_to: ""

# Optional. Continuously watches a symbol list for SMC setups (Order Block
# + Break of Structure) on the live market, independent of any trade you
# actually copy -- alerts (via `notifications:` above) with a suggested
# entry/SL/TP and records every detection for later analysis. Alerts only:
# nothing here ever opens a trade on its own. Needs SignalPublisher's
# ScanSymbols input set to the same list (see mql/README.md).
market_scan:
  enabled: false
  symbols: [EURUSD, GBPUSD, XAUUSD]
  rr_ratio: 2.0
  poll_interval_seconds: 60

source_account:
  id: broker_a_source
  # Absolute path to <Terminal>/MQL4/Files/edgeflow on the VPS filesystem
  # (see mql/README.md for how this maps under Wine).
  files_dir: /home/edgeflow/.wine/drive_c/Program Files/BrokerA MT4/MQL4/Files/edgeflow

targets:
  - id: broker_b_target
    files_dir: /home/edgeflow/.wine/drive_c/Program Files/BrokerB MT5/MQL5/Files/edgeflow
    risk_pct: 1.0   # % of THIS account's equity to risk per copied trade
    # Optional hard safety ceiling in lots, independent of the risk-parity
    # calculation -- caps a trade even if a bad config or data glitch made
    # the risk math compute something unreasonably large. Omit to disable.
    max_absolute_volume: 5.0
    symbol_specs:
      EURUSD:
        contract_size: 100000
        tick_size: 0.00001
        tick_value: 1.0     # account-currency value of 1 tick move, per 1.0 lot -- get this from the broker's contract specs
        volume_step: 0.01
        volume_min: 0.01
        volume_max: 100
      XAUUSD:
        contract_size: 100
        tick_size: 0.01
        tick_value: 1.0
        volume_step: 0.01
        volume_min: 0.01
        volume_max: 50
